<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Spin the Wheel</title><style>body{font:16px system-ui;background:#101827;color:white;text-align:center;margin:20px}main{max-width:520px;margin:auto}canvas{width:100%;height:auto}select,button{font:inherit;padding:13px;border-radius:10px;margin:8px;max-width:95%}button{background:#16a34a;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}.wheel{position:relative}.pointer{position:absolute;left:50%;top:0;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid white;z-index:1}#result{font-size:24px;min-height:36px}</style><main><h1>Team Spin the Wheel</h1><div id="count"></div><div class="wheel"><div class="pointer"></div><canvas id="wheel" width="800" height="800"></canvas></div><label>Who is spinning?<br><select id="person"><option value="">Select your name</option><option value="Chang">Chang</option><option value="Elton">Elton</option><option value="Hafis">Hafis</option><option value="Haiqal">Haiqal</option><option value="Irfan Jr">Irfan Jr</option><option value="Jitren">Jitren</option><option value="Khalid">Khalid</option><option value="KY">KY</option><option value="Luk">Luk</option><option value="Qifeng">Qifeng</option><option value="Saifudin">Saifudin</option><option value="Shah">Shah</option><option value="Solihin">Solihin</option><option value="Tazrina">Tazrina</option><option value="TL">TL</option><option value="Vernon">Vernon</option><option value="Vitha">Vitha</option><option value="Zilin">Zilin</option></select></label><br><button id="spin">SPIN THE WHEEL</button><div id="result" aria-live="polite"></div><button id="reset" style="background:#475569">Restart draw</button></main><script>
const groups=[['TL','Elton','Jitren','Vitha','Chang','KY'],['Khalid','Hafis','Qifeng','Saifudin','Tazrina','Shah','Irfan Jr','Vernon','Haiqal','Luk','Zilin','Solihin']],all=groups.flat(),c=document.querySelector('canvas'),ctx=c.getContext('2d'),person=document.querySelector('#person'),spin=document.querySelector('#spin'),result=document.querySelector('#result'),count=document.querySelector('#count'),reset=document.querySelector('#reset'),tau=Math.PI*2;let names,pairs,done,used,angle,busy=false;const colors=['#2563eb','#be185d','#047857','#b45309','#7c3aed','#0e7490','#b91c1c'];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function draw(){ctx.clearRect(0,0,800,800);let n=names.length;if(!n)return;names.forEach((name,i)=>{let s=angle+i*tau/n,e=s+tau/n,m=(s+e)/2;ctx.beginPath();ctx.moveTo(400,400);ctx.arc(400,400,390,s,e);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(400,400);ctx.rotate(m);ctx.fillStyle='white';ctx.font='bold 26px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(name,365,0);ctx.restore()});ctx.beginPath();ctx.arc(400,400,36,0,tau);ctx.fillStyle='white';ctx.fill()}function refresh(){person.options.length=0;person.add(new Option('Select your name',''));all.filter(x=>!done.has(x)).sort().forEach(x=>person.add(new Option(x,x)));count.textContent=done.size+' / 18 completed';spin.disabled=true;person.disabled=done.size===18;reset.disabled=false}function init(){pairs={};for(const g of groups){let p;do{p=shuffle(g)}while(p.some((x,i)=>x===g[i]));g.forEach((x,i)=>pairs[x]=p[i])}names=shuffle(all);done=new Set();used=new Set();angle=0;busy=false;result.textContent='Ready to spin!';draw();refresh()}person.onchange=()=>spin.disabled=!person.value||busy;spin.onclick=()=>{if(busy||!person.value)return;let who=person.value,winner=pairs[who];busy=true;spin.disabled=person.disabled=reset.disabled=true;names=names.filter(x=>!used.has(x));angle=0;let i=names.indexOf(winner),target=(((-Math.PI/2-(i+.5)*tau/names.length)%tau)+tau)%tau+tau*6;let start=performance.now();result.textContent='Spinning…';function frame(t){let p=Math.min(1,(t-start)/4000);angle=target*(1-Math.pow(1-p,4));draw();if(p<1)requestAnimationFrame(frame);else{done.add(who);used.add(winner);busy=false;result.textContent=who+' drew '+winner+'!';refresh()}}requestAnimationFrame(frame)};reset.onclick=()=>{if(!busy&&confirm('Restart and clear all results?'))init()};init();</script></html>
